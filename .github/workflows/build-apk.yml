name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/bta-anonymous-manager]

jobs:
  apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platforms
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund

      - name: Full application and backend tests
        run: |
          npm run test:unit
          npm run test:functions
          npm run test:rules

      - name: TypeScript check
        run: npm run lint

      - name: Validate and test WordPress Core
        run: |
          command -v php || (sudo apt-get update && sudo apt-get install -y php-cli)
          find wordpress/fondation-kenda-core -name '*.php' -exec php -l {} \;
          npm run test:core
          python3 scripts/package-core.py

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD_SECRET" ] || \
             [ -z "$KEY_PASSWORD_SECRET" ] || \
             [ -z "$KEY_ALIAS_SECRET" ]; then
            echo "ERROR: Permanent Android signing secrets are missing."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/bta-release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore file is empty or invalid."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD_SECRET" \
            -keypass "$KEY_PASSWORD_SECRET" \
            -alias "$KEY_ALIAS_SECRET" > /dev/null

          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET"
          } >> "$GITHUB_ENV"

          echo "Permanent signing key verified successfully."

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bta-manager-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload WordPress Core ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fondation-kenda-core
          path: artifacts/fondation-kenda-core-*.zip
          if-no-files-found: error
