name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master, feature/bta-anonymous-manager]

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21   # requis par l'émulateur Firestore
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm --prefix functions ci --no-audit --no-fund
      - name: Typage de l'application
        run: npm run lint
      - name: Tests du moteur de synchronisation
        run: npm run test:unit
      - name: Validate and test WordPress Core
        run: |
          command -v php || (sudo apt-get update && sudo apt-get install -y php-cli)
          find wordpress/fondation-kenda-core -name '*.php' -exec php -l {} \;
          npm run test:core
          python3 scripts/package-core.py

      - name: Tests des fonctions serveur
        run: npm run test:functions
      - name: Tests d'isolation des règles Firestore
        run: npm run test:rules
